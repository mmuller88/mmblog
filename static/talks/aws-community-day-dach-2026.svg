<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="AI agent control plane on VPS managing AWS deployments">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FF9900"/>
    </marker>
    <style>
      .zone { fill: #0d1117; stroke: #414d5c; stroke-width: 2; rx: 12; }
      .box { fill: #16191f; stroke: #414d5c; stroke-width: 2; rx: 8; }
      .label { fill: #ffffff; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .sublabel { fill: #879596; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
      .arrow { stroke: #FF9900; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .title { fill: #FF9900; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .zone-title { fill: #eaeded; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">CONTROL PLANE (VPS) → AWS PRODUCTION TARGETS</text>

  <rect x="24" y="52" width="420" height="300" class="zone"/>
  <text x="44" y="78" class="zone-title">Hostinger VPS · Docker · ~€10/mo</text>

  <rect x="48" y="96" width="120" height="56" class="box"/>
  <text x="108" y="122" text-anchor="middle" class="label">Telegram</text>
  <text x="108" y="140" text-anchor="middle" class="sublabel">you → agent</text>

  <rect x="188" y="96" width="120" height="56" class="box"/>
  <text x="248" y="122" text-anchor="middle" class="label">OpenClaw</text>
  <text x="248" y="140" text-anchor="middle" class="sublabel">gateway + cron</text>

  <rect x="328" y="96" width="96" height="56" class="box"/>
  <text x="376" y="122" text-anchor="middle" class="label">GitHub</text>
  <text x="376" y="140" text-anchor="middle" class="sublabel">issues · PRs</text>

  <rect x="48" y="176" width="160" height="56" class="box"/>
  <text x="128" y="202" text-anchor="middle" class="label">Cursor CLI</text>
  <text x="128" y="220" text-anchor="middle" class="sublabel">plan · implement</text>

  <rect x="228" y="176" width="196" height="56" class="box"/>
  <text x="326" y="202" text-anchor="middle" class="label">Memory files</text>
  <text x="326" y="220" text-anchor="middle" class="sublabel">MEMORY.md · heartbeat · skills</text>

  <rect x="48" y="256" width="376" height="72" class="box"/>
  <text x="236" y="284" text-anchor="middle" class="label">Human in the loop</text>
  <text x="236" y="304" text-anchor="middle" class="sublabel">review PR · approve merge · SSO device-code · kill runaway jobs</text>

  <rect x="516" y="52" width="420" height="300" class="zone"/>
  <text x="536" y="78" class="zone-title">AWS · what the agent deploys &amp; operates</text>

  <rect x="540" y="96" width="170" height="64" class="box"/>
  <text x="625" y="122" text-anchor="middle" class="label">HalloCasa</text>
  <text x="625" y="140" text-anchor="middle" class="sublabel">CDK · CodePipeline · prod DB</text>

  <rect x="730" y="96" width="170" height="64" class="box"/>
  <text x="815" y="122" text-anchor="middle" class="label">ai-secure.dev</text>
  <text x="815" y="140" text-anchor="middle" class="sublabel">AgentCore · MCP · scans</text>

  <rect x="540" y="184" width="360" height="64" class="box"/>
  <text x="720" y="210" text-anchor="middle" class="label">qr-plakat.de</text>
  <text x="720" y="228" text-anchor="middle" class="sublabel">OpenNext · hosted landing pages · metadata preview</text>

  <rect x="540" y="272" width="360" height="56" class="box"/>
  <text x="720" y="298" text-anchor="middle" class="label">AWS SSO · sts · CloudWatch</text>
  <text x="720" y="316" text-anchor="middle" class="sublabel">agent requests creds → you approve on phone</text>

  <path d="M444 152 L516 152" class="arrow"/>
  <path d="M168 152 L188 152" class="arrow"/>
  <path d="M308 152 L328 152" class="arrow"/>
  <path d="M248 152 L248 176" class="arrow"/>
  <path d="M376 152 L376 176 L326 176" class="arrow"/>

  <text x="480" y="378" text-anchor="middle" class="sublabel">Agent stays on VPS · AWS is where production lives · LLM tokens are still 95% of the bill</text>
</svg>
