name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'deploy-prod' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

env:
  NODE_VERSION: "20"
  AWS_REGION: us-east-1

jobs:
  ci:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            site:
              - 'content/**'
              - 'src/**'
              - 'static/**'
              - 'gatsby-*.js'
              - 'postcss.config.js'
              - 'tailwind.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
            infra:
              - 'infra/**'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install site deps
        if: steps.changes.outputs.site == 'true'
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.site == 'true'
        run: npm run build

      - name: Smoke
        if: steps.changes.outputs.site == 'true'
        run: npm run test:smoke

  deploy:
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            site:
              - 'content/**'
              - 'src/**'
              - 'static/**'
              - 'gatsby-*.js'
              - 'postcss.config.js'
              - 'tailwind.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
            infra:
              - 'infra/**'

      - name: What to run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="${{ steps.changes.outputs.site }}"
          infra="${{ steps.changes.outputs.infra }}"

          # Path filter only sees this push. A cancelled deploy can leave
          # site or infra changes unpublished; diff against the last publish.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            site=true
            infra=true
          elif [ "$site" != true ] || [ "$infra" != true ]; then
            site_base=""
            infra_base=""
            if ! runs=$(gh run list --workflow deploy.yml --branch "${{ github.ref_name }}" --limit 30 \
              --json databaseId,headSha,conclusion,event \
              --jq '.[] | select(.conclusion=="success" and (.event=="push" or .event=="workflow_dispatch")) | "\(.databaseId) \(.headSha)"'); then
              echo "could not list deploy runs; building and deploying"
              site=true
              infra=true
              runs=""
            fi
            while read -r id sha; do
              [ -z "${id:-}" ] && continue
              [ "$sha" = "${{ github.sha }}" ] && continue
              [ -n "$site_base" ] && [ -n "$infra_base" ] && break
              names=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" \
                --jq '.jobs[] | select(.name=="deploy") | .steps[] | select(.conclusion=="success") | .name')
              if [ -z "$site_base" ] && printf '%s\n' "$names" | grep -Fxq "Sync + invalidate"; then
                site_base=$sha
              fi
              if [ -z "$infra_base" ] && printf '%s\n' "$names" | grep -Fxq "CDK deploy"; then
                infra_base=$sha
              fi
            done <<< "$runs"

            touches() {
              local base="$1" pattern="$2" files count
              if [ -z "$base" ]; then
                return 0
              fi
              if ! files=$(gh api "repos/${{ github.repository }}/compare/${base}...${{ github.sha }}" --jq '.files[].filename'); then
                echo "compare $base failed; treating as changed"
                return 0
              fi
              count=$(printf '%s\n' "$files" | grep -c . || true)
              if [ "$count" -ge 300 ]; then
                return 0
              fi
              printf '%s\n' "$files" | grep -Eq "$pattern"
            }

            if [ "$site" != true ] && touches "$site_base" '^(content|src|static|scripts)/|^gatsby-.*\.js$|^postcss\.config\.js$|^tailwind\.config\.js$|^package(-lock)?\.json$'; then
              echo "site changes since ${site_base:-none}"
              site=true
            fi
            if [ "$infra" != true ] && touches "$infra_base" '^infra/'; then
              echo "infra changes since ${infra_base:-none}"
              infra=true
            fi
            echo "published site_base=${site_base:-none} infra_base=${infra_base:-none}"
          fi

          if [ "$site" = true ] || [ "$infra" = true ]; then
            aws=true
          else
            aws=false
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "aws=$aws" >> "$GITHUB_OUTPUT"
          echo "run site=$site infra=$infra aws=$aws"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install site deps
        if: steps.run.outputs.site == 'true'
        run: npm ci

      - name: Build site
        if: steps.run.outputs.site == 'true'
        run: npm run build
        env:
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}

      - name: Smoke
        if: steps.run.outputs.site == 'true'
        run: npm run test:smoke

      - name: CDK synth
        if: steps.run.outputs.infra == 'true'
        working-directory: infra
        run: npx cdk synth --quiet -c manageDns=true

      - name: Configure AWS credentials
        if: steps.run.outputs.aws == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        if: steps.run.outputs.infra == 'true'
        working-directory: infra
        run: npx cdk deploy --require-approval never -c manageDns=true --outputs-file cdk-outputs.json

      - name: Sync + invalidate
        if: steps.run.outputs.site == 'true'
        run: |
          if [ -f infra/cdk-outputs.json ]; then
            BUCKET=$(jq -r '.MmblogStack.BucketName' infra/cdk-outputs.json)
            DIST=$(jq -r '.MmblogStack.DistributionId' infra/cdk-outputs.json)
          else
            BUCKET=$(aws cloudformation describe-stacks --stack-name MmblogStack --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
            DIST=$(aws cloudformation describe-stacks --stack-name MmblogStack --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          fi
          test -n "$BUCKET" && test "$BUCKET" != "None" && test "$BUCKET" != "null"
          test -n "$DIST" && test "$DIST" != "None" && test "$DIST" != "null"
          chmod +x scripts/sync-site.sh
          ./scripts/sync-site.sh "$BUCKET" "$DIST"
